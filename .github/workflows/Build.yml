name: Build Switch NRO

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install devkitPro and Switch Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gdebi-core make
          
          # Download and run official devkitPro installer for Ubuntu
          wget https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          
          # Install switch development packages cleanly
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm switch-dev libnx switch-tools

      - name: Run Make Compiler
        run: |
          # Set explicit environment paths for the build step
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$PATH:$DEVKITPRO/tools/bin
          
          make

      - name: Upload Compiled NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonControl-NRO
          path: PokemonControl.nro
