name: Build Switch NRO

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Permanent Case Fix for Source Files
        run: |
          echo "Checking source directory contents before fix:"
          ls -la source/ || true
          
          # Force any variant of Main.c / MAIN.c to lowercase main.c
          if [ -f "source/Main.c" ]; then
            mv source/Main.c source/main.c
            echo "Renamed Main.c to main.c"
          fi
          if [ -f "source/MAIN.c" ]; then
            mv source/MAIN.c source/main.c
            echo "Renamed MAIN.c to main.c"
          fi
          if [ -f "source/Main.cpp" ]; then
            mv source/Main.cpp source/main.cpp
            echo "Renamed Main.cpp to main.cpp"
          fi
          
          echo "Source directory contents after fix:"
          ls -la source/

      - name: Install DevkitPro & Switch Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gdebi-core make curl
          
          # Download installer with browser User-Agent
          wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          
          # Force dkp-pacman package sync and install tools
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm switch-dev libnx switch-tools

      - name: Compile NRO Binary
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:$PATH
          
          make clean
          make V=1
          
          # Fallback manual ELF to NRO conversion if needed
          if [ -f "build/PokemonControl.elf" ]; then
            elf2nro build/PokemonControl.elf PokemonControl.nro
          elif [ -f "PokemonControl.elf" ]; then
            elf2nro PokemonControl.elf PokemonControl.nro
          fi

      - name: Verify NRO Output
        run: |
          if [ -f "PokemonControl.nro" ]; then
            echo "SUCCESS: PokemonControl.nro generated!"
            ls -lh PokemonControl.nro
          else
            echo "ERROR: NRO file was not created. Directory layout:"
            ls -la
            exit 1
          fi

      - name: Upload Compiled NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonControl-NRO
          path: PokemonControl.nro
