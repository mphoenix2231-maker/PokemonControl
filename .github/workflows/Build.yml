name: Build Switch NRO

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Disable Pacman Signature Checks
        run: |
          # This disables key verification entirely so pacman never fails on missing keys
          sed -i 's/SigLevel = Required DatabaseOptional/SigLevel = Never/g' /etc/pacman.conf
          sed -i 's/SigLevel = PackageRequired/SigLevel = Never/g' /etc/pacman.conf

      - name: Install Switch Development Libraries
        run: |
          dkp-pacman -Sy --noconfirm switch-dev libnx switch-tools

      - name: Verify Project Structure
        run: |
          ls -R

      - name: Run Make Compiler
        run: |
          make

      - name: Upload Compiled NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonControl-NRO
          path: PokemonControl.nro
    
