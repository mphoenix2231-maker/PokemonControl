name: Build Switch NRO

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & DevkitPro Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gdebi-core make
          
          # Download installer using browser User-Agent to bypass Cloudflare 403 blocks
          wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          
          # Force sync and install switch development packages with retry logic
          sudo dkp-pacman -Sy --noconfirm || true
          sudo dkp-pacman -S --noconfirm switch-dev libnx switch-tools || \
          sudo dkp-pacman -S --noconfirm --needed switch-dev libnx switch-tools

      - name: Verify Environment Paths
        run: |
          echo "Checking if libnx exists..."
          ls -la /opt/devkitpro/libnx || echo "libnx folder missing!"

      - name: Compile NRO Binary
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$PATH:$DEVKITPRO/tools/bin
          
          make

      - name: Upload Compiled NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonControl-NRO
          path: PokemonControl.nro
