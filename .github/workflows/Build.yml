name: Build Switch NRO

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DevkitPro and Switch Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gdebi-core make curl
          
          # Download installer using browser User-Agent to bypass Cloudflare blocks
          wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          
          # Force dkp-pacman to initialize and sync package databases completely
          sudo dkp-pacman -Sy --noconfirm
          
          # Explicitly install switch-dev, libnx, and switch-tools
          sudo dkp-pacman -S --noconfirm switch-dev libnx switch-tools

      - name: Verify Environment and Libnx Files
        run: |
          echo "Checking contents of /opt/devkitpro:"
          ls -la /opt/devkitpro || true
          echo "Checking contents of /opt/devkitpro/libnx:"
          ls -la /opt/devkitpro/libnx || true

      - name: Compile NRO Binary
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$PATH:$DEVKITPRO/tools/bin
          
          # Run make with verbose output to track rule execution
          make V=1

      - name: Upload Compiled NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonControl-NRO
          path: PokemonControl.nro
