name: Build Switch NRO

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Switch Development Libraries
        run: |
          dkp-pacman -Syu --noconfirm switch-dev

      - name: Run Make Compiler
        run: |
          make

      - name: Upload Compiled NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonControl-NRO
          path: PokemonControl.nro